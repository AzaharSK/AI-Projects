server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: systemd-journal
    journal:
      path: /var/log/journal
      labels:
        job: systemd
        host: ${HOSTNAME}
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit

  - job_name: fastapi-observability
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi-observability
          app: fastapi
          host: ${HOSTNAME}
          __path__: /var/log/fastapi-observability/*.log
