---
# tax-calculator-frontend — React/Vite app served by Nginx
#
# IMPORTANT — VITE_API_URL is baked into the JS bundle at image build time.
# Build the frontend image with the ingress API base path:
#
#   docker build \
#     --build-arg VITE_API_URL=/api \
#     -t tax-calculator-frontend:latest \
#     ./tax-calculator-frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tax-calculator-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  # ClusterIP — ingress routes /(.*) to this service.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
