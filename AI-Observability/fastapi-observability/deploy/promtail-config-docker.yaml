server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fastapi-observability
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi-observability
          app: fastapi
          host: docker
          __path__: /var/log/fastapi-observability/*.log
